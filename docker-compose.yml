version: '3.8'

services:
  # Serviço do banco de dados PostgreSQL
  db:
    image: postgres:13
    container_name: postgres_produtos
    environment:
      POSTGRES_DB: aula
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - produtos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço da aplicação web Flask
  web:
    build: .
    container_name: flask_produtos
    environment:
      DB_HOST: db
      POSTGRES_DB: aula
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - produtos_network
    restart: unless-stopped

# Volume nomeado para persistência dos dados do PostgreSQL
volumes:
  postgres_data:

# Rede para comunicação entre os serviços
networks:
  produtos_network:
    driver: bridge
